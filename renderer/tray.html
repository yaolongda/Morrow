<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
  />
  <title>朝暮 · 今日</title>
  <link rel="stylesheet" href="tray.css" />
</head>
<body>
  <div class="tray-card">
    <div class="tray-head">
      <button class="tray-nav" data-action="prev" aria-label="上个月">‹</button>
      <div class="tray-title">
        <strong id="tray-month"></strong>
        <span id="tray-sub"></span>
      </div>
      <button class="tray-nav" data-action="next" aria-label="下个月">›</button>
    </div>
    <div class="tray-weekdays" id="tray-weekdays"></div>
    <div class="tray-grid" id="tray-grid"></div>
    <div class="tray-foot">
      <button class="tray-btn" data-action="open">打开日历</button>
      <button class="tray-btn primary" data-action="new-event">新建日程</button>
    </div>
  </div>
  <script src="lib/schedule.js"></script>
  <script src="lib/holidays.js"></script>
  <script src="lib/recurrence.js"></script>
  <script src="tray.js"></script>
</body>
</html>
