<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朝暮小组件</title>
  <link rel="stylesheet" href="widget.css" />
  <link rel="stylesheet" href="widget-extra.css" />
</head>
<body>
  <div class="widget-shell">
    <div class="widget-bg" id="widget-bg" aria-hidden="true"></div>
    <div class="widget-bg-dim" id="widget-bg-dim" aria-hidden="true"></div>
    <div class="widget-card" id="widget-card">
      <div class="widget-controls">
        <button class="widget-control" id="pin-btn" title="固定在其它窗口上方" aria-label="固定小组件">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.2 3.8h5.6l-.7 5.3 3 2.8v1.2H6.9v-1.2l3-2.8-.7-5.3Z" />
            <path d="M12 13.1V20.5" />
          </svg>
        </button>
        <button class="widget-control" id="close-btn" title="关闭小组件" aria-label="关闭小组件">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div class="widget-content" id="widget-content"></div>
      <div class="celebration hidden" id="celebration" aria-live="polite">
        <canvas class="celebration-canvas" id="celebration-canvas"></canvas>
        <div class="celebration-copy">
          <span class="celebration-kicker" id="celebration-kicker"></span>
          <strong class="celebration-line" id="celebration-line"></strong>
          <span class="celebration-from" id="celebration-from"></span>
          <span class="celebration-hint" id="celebration-hint">辛苦了</span>
        </div>
      </div>
      <div class="widget-menu hidden" id="widget-menu" role="menu">
        <button data-action="size-default" role="menuitem">回到推荐大小</button>
        <div class="widget-menu-sep"></div>
        <button data-action="lock" role="menuitem" id="lock-menu-btn">锁定位置与尺寸</button>
        <button data-action="pin" role="menuitem" id="pin-menu-btn">置顶</button>
        <div class="widget-menu-sep"></div>
        <button data-action="close" role="menuitem" class="danger">关闭小组件</button>
      </div>
      <div class="resize-hint" aria-hidden="true"></div>
      <div class="resize-grip" id="resize-grip" title="拖动调整大小" aria-hidden="true"></div>
    </div>
  </div>
  <script src="lib/schedule.js"></script>
  <script src="lib/holidays.js"></script>
  <script src="lib/workday.js"></script>
  <script src="lib/almanac.js"></script>
  <script src="lib/recurrence.js"></script>
  <script src="appearance.js"></script>
  <script src="widget.js"></script>
</body>
</html>
